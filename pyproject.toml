[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pifdm"
version = "0.1.0"
description = "Physics-informed frozen diffusion models for PDE solution operators"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "h5py>=3.8", "tqdm>=4.66"]

[project.optional-dependencies]
ml = ["torch>=2.1"]
data = ["numba>=0.58", "sympy>=1.12", "matplotlib>=3.7"]
test = ["pytest>=8", "torch>=2.1"]

[tool.setuptools.packages.find]
include = ["pifdm*", "case_studies*"]
